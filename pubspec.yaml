name: dreamhouse237_mobile
description: "DreamHouse - Plateforme immobilière Cameroun"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.0
  http: ^1.2.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.0
  photo_view: ^0.15.0
  carousel_slider: ^4.2.0

  # Maps
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # Utilities
  url_launcher: ^6.3.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.3

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4

  # App Icons
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/logo.png"

  min_sdk_android: 21

  adaptive_icon_background: "#007B83"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/